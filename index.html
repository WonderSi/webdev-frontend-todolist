<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="./dist/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <header class="header">
        <h1 class="header__name">TODO LIST</h1>
        <div class="search-bar">
            <input type="text" class="search-bar__input" placeholder="Search note...">
            <button class="search-bar__submit">
                <!-- svg -->
            </button>
        </div>
        <div class="controls">
            <button class="controls__button controls__button--dropdown">
                ALL
                <!-- svg -->
            </button>
            <button class="controls__button controls__button--theme-toggle">
                <!-- svg -->
            </button>
        </div>
    </header>
    <main class="todo-list">
        <div class="todo-list__tasks"></div>
        <button class="todo-list__add-button">
            <!-- svg -->
        </button>
    </main>
    <script src="./js/script.js"></script>
</body>
</html>
